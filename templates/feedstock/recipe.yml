# Feedstock recipe for @@NAME@@
# spec 13 §9 + docs/conventions.md in tebako-packages/index
name: "@@NAME@@"
kind: toolkit
summary: "@@SUMMARY@@"

upstream:
  url: "@@UPSTREAM_TARBALL_URL@@"
  sha256: "@@UPSTREAM_SHA256@@"
  version: "@@UPSTREAM_VERSION@@"

build:
  system: autotools        # autotools | cmake | meson
  link_mode: dynamic       # dynamic | wrapped | tfs-native | static
  rpath_origin: true       # $ORIGIN/../lib for dynamic builds
  deps: []                 # other feedstocks: [{name, constraint, mount}]

# Image tooling (every leg): the tfs CLI from the tamatebako/tebako
# release — `tfs mkimage` (limnifs, the default tebako image format) is
# the imager and the boot smoke's info/tree/extract reader. The
# per-platform asset digests are pinned here (the repo's toolchain pin
# SSOT — the same trust-anchor role as upstream.sha256) and
# cross-checked against the release's own SHA256SUMS at fetch time.
tools:
  repo: "tamatebako/tebako"
  release: "@@TEBAKO_RELEASE@@"
  sha256:
    linux-gnu-x86_64: "@@TFS_SHA256_LINUX_GNU_X86_64@@"
    linux-gnu-arm64: "@@TFS_SHA256_LINUX_GNU_ARM64@@"
    macos-arm64: "@@TFS_SHA256_MACOS_ARM64@@"
    macos-x86_64: "@@TFS_SHA256_MACOS_X86_64@@"

platforms:
  - x86_64-linux-gnu
  - aarch64-linux-gnu
  - aarch64-macos
  - x86_64-macos

provides:
  executables:
    - {name: "@@NAME@@", path: "/bin/@@NAME@@", version: "@@UPSTREAM_VERSION@@"}
  libraries: []

exec_tier: dynamic         # from build.link_mode
exec_closure: []           # static tier only
