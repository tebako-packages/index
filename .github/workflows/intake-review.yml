name: intake-review
# The community feedstock lane (tebako-packages/index#23; docs/community-feedstock.md).
#
# A community submission is a PR that adds (or re-points) a packages: row
# in tpkg-registry.yaml. The review job runs tools/intake_review.rb over
# base..head and posts the verdict as a PR comment — REPORT-ONLY: this
# lane never auto-merges; a human maintainer merges (docs/governance.md).
#
# Two triggers, one job, exactly one run per PR:
#
#   pull_request         — same-repo submissions. Runs the workflow from
#                          the PR's own tree (so a not-yet-merged lane
#                          reviews submissions against itself); the token
#                          carries the declared write permissions.
#   pull_request_target  — FORK submissions only (the job's if: gates).
#                          Since 2025-12-08 GitHub always sources this
#                          event's workflow from the DEFAULT branch — the
#                          trusted copy — and grants the write token the
#                          verdict comment needs. The safety contract the
#                          event demands is kept by construction: the TOOL
#                          runs from the BASE checkout and the PR's head
#                          is checked out only to READ tpkg-registry.yaml
#                          as data — no submission code is ever executed.
#
# In both events the scope gate fails the review when a PR touches
# anything beyond the catalog, so a submission never carries its own
# review machinery. A PR that leaves the catalog untouched (a tooling
# change riding the paths below) is skipped silently — no verdict, no
# comment.
#
# The selftest job rides the hermetic fixtures (tools/fixtures/intake,
# file:// only) whenever the tool itself changes — the
# test-probe-registry-row.yml idiom.
on:
  pull_request:
    paths:
      - "tpkg-registry.yaml"
      - "tools/intake_review.rb"
      - "tools/fixtures/intake/**"
      - ".github/workflows/intake-review.yml"
  pull_request_target:
    paths: ["tpkg-registry.yaml"]
  push:
    branches: [main]
    paths:
      - "tools/intake_review.rb"
      - "tools/fixtures/intake/**"
      - ".github/workflows/intake-review.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: intake-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: review the submission
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      # The trusted side: the review tool and the base catalog come from
      # the PR's BASE ref — never from the submission.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # The submission, checked out as DATA: only tpkg-registry.yaml is
      # read; nothing in head/ is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Scope gate — the lane admits catalog rows only
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          changed="$(gh pr diff "$PR" --name-only | sort)"
          echo "changed files:"; echo "$changed"
          if ! printf '%s\n' "$changed" | grep -qx "tpkg-registry.yaml"; then
            # The catalog is untouched (a tooling PR riding the trigger
            # paths) — no submission, no verdict, no comment.
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" != "1" ]; then
            {
              echo "# Intake review — verdict: RED"
              echo
              echo "- ✗ **ScopeViolation** — this lane reviews submissions that change"
              echo "  \`tpkg-registry.yaml\` and nothing else; this PR changes:"
              printf '%s\n' "$changed" | sed 's/^/  - /'
              echo
              echo "Tooling or doc changes ride ordinary PRs; a submission never"
              echo "carries its own review machinery."
            } > "$RUNNER_TEMP/verdict.md"
            echo "red=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the intake review
        if: steps.scope.outputs.skip != '1' && steps.scope.outputs.red != '1'
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ruby tools/intake_review.rb \
            --base tpkg-registry.yaml \
            --head head/tpkg-registry.yaml \
            --report "$RUNNER_TEMP/verdict.md"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Post the verdict (report-only — a human merges)
        if: always() && steps.scope.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          {
            echo
            echo "---"
            echo "_run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · docs: [community-feedstock](https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/docs/community-feedstock.md) · [governance](https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/docs/governance.md)_"
          } >> "$RUNNER_TEMP/verdict.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/verdict.md"

      - name: Verdict drives the check
        if: always() && steps.scope.outputs.skip != '1'
        run: |
          [ "${{ steps.scope.outputs.red }}" = "1" ] && exit 1
          exit "${{ steps.review.outputs.rc || '1' }}"

  selftest:
    name: fixture truth table (file://, hermetic)
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the intake fixtures
        env:
          # the live leg (leg 4) exercises the token-bearing request
          # path — the presigned-URL auth discipline is what's under test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/fixtures/intake/selftest.sh
