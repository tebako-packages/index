schema_version: 1
# The tebako-packages catalog (registry-of-registries). Each entry is a
# feedstock's own registry; the dispatcher resolves nicknames through it.
# Entries are added when a feedstock publishes its first release.
packages:
  - name: inkscape
    kind: toolkit
    summary: Vector graphics editor (CLI tools) — metanorma's graphics chain
    registry: tfs:github:tebako-packages/inkscape
  - name: fontist
    kind: app
    summary: Font installer CLI (ruby app; runtime-required payload, ruby ~> 3.3.0 ABI)
    registry: tfs:github:tebako-packages/fontist
  - name: metanorma
    kind: app
    summary: Standards-document authoring CLI (ruby app; requires toolkit inkscape at /opt/inkscape)
    registry: tfs:github:tebako-packages/metanorma
  - name: hello
    kind: toolkit
    summary: GNU hello — template prover payload for tebako-packages
    registry: tfs:github:tebako-packages/hello
